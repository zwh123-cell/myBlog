server:
  port: 8080

spring:
  application:
    name: blog-server
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  access-secret: change-me-access-secret-key
  refresh-secret: change-me-refresh-secret-key
  access-expiration: 900000        # 15 分钟（毫秒）
  refresh-expiration: 604800000    # 7 天（毫秒）

oss:
  endpoint: ""
  access-key: ""
  secret-key: ""
  bucket: blog-images
